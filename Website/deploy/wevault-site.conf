server {
    listen 80;
    listen [::]:80;
    server_name wevault.online;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://wevault.online$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wevault.online;
    ssl_certificate /etc/letsencrypt/live/wevault.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wevault.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/wevault-site/current;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
