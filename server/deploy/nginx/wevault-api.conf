server {
    listen 80;
    listen [::]:80;
    server_name api.wevault.online;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.wevault.online;
    ssl_certificate /etc/letsencrypt/live/api.wevault.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wevault.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.3 suites are managed separately by OpenSSL. Keep modern TLS 1.2
    # clients compatible without weakening the isolated API virtual host.
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:secp384r1:prime256v1;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:31061;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Do not preserve an inbound X-Forwarded-For value: the API trusts
        # only this local proxy when deriving the address for rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
